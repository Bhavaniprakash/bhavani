apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: multi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: your-aws-account-id.dkr.ecr.us-east-1.amazonaws.com/app1:latest
          ports:
            - containerPort: 8080
