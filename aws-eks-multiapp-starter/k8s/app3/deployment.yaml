apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: multi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: your-aws-account-id.dkr.ecr.us-east-1.amazonaws.com/app3:latest
          ports:
            - containerPort: 8080
