name: Build and Push Images to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  push-ui:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Linux UI image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd aws-eks-multiapp-starter/apps/ui-app
          docker buildx build --platform linux/amd64 --push -t $ECR_REGISTRY/ui-app:$IMAGE_TAG .

  push-backend:
    runs-on: ubuntu-latest
    needs: push-ui
    strategy:
      matrix:
        include:
          - app_name: app1
            app_path: aws-eks-multiapp-starter/apps/app1
          - app_name: app2
            app_path: aws-eks-multiapp-starter/apps/app2
          - app_name: app3
            app_path: aws-eks-multiapp-starter/apps/app3
          - app_name: app4
            app_path: aws-eks-multiapp-starter/apps/app4

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Linux backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ${{ matrix.app_path }}
          docker buildx build --platform linux/amd64 --push -t $ECR_REGISTRY/${{ matrix.app_name }}:$IMAGE_TAG .
